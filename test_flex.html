<!DOCTYPE html>
<html>
<head>
<style>
  .kinship-grid {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 16px;
    height: 400px;
  }
  .kinship-col {
    display: grid;
    gap: 16px;
    border: 1px solid red;
  }
  .kinship-card {
    border: 1px solid blue;
    padding: 16px;
  }
</style>
</head>
<body>
  <div class="kinship-grid">
    <div class="kinship-col" style="grid-template-rows: repeat(1, 1fr);">
      <div class="kinship-card" style="grid-row: span 1">1</div>
    </div>
    <div class="kinship-col" style="grid-template-rows: repeat(3, 1fr);">
      <div class="kinship-card" style="grid-row: span 2">2.1</div>
      <div class="kinship-card" style="grid-row: span 1">2.2</div>
    </div>
    <div class="kinship-col" style="grid-template-rows: repeat(3, 1fr);">
      <div class="kinship-card" style="grid-row: span 1">3.1</div>
      <div class="kinship-card" style="grid-row: span 1">3.2</div>
      <div class="kinship-card" style="grid-row: span 1">3.3</div>
    </div>
  </div>
</body>
</html>
